server:
  port: 8080

spring:
  profiles:
    active: dev
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_trade?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: admin
      filter:
        stat:
          enabled: true
          slow-sql-millis: 2000
          log-slow-sql: true
        wall:
          enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.campus.trade.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: campus-trade-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000

alipay:
  app-id: 2021000122000000
  private-key: MIIEvQIBADANBgkqhkiG9w0BAQEFAASC...sandbox-private-key
  alipay-public-key: MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A...sandbox-public-key
  gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: http://localhost:8080/api/payment/callback/alipay
  return-url: http://localhost:8080/api/payment/return/alipay

order:
  payment-timeout-minutes: 15

settlement:
  platform-fee-rate: 0.02

logging:
  level:
    com.campus.trade: debug
    com.campus.trade.mapper: debug
