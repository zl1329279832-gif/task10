spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_trade?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000

jwt:
  secret: CampusTradeSecretKey2024CampusTradeSecretKey2024CampusTradeSecretKey2024
  expiration: 86400000
  refresh-expiration: 604800000

alipay:
  app-id: ${ALIPAY_APP_ID:your_app_id}
  private-key: ${ALIPAY_PRIVATE_KEY:your_private_key}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:your_alipay_public_key}
  server-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: ${ALIPAY_NOTIFY_URL:http://your-domain/api/v1/pay/notify}
  return-url: ${ALIPAY_RETURN_URL:http://localhost:3000/pay/result}
  sign-type: RSA2
  charset: UTF-8

trade:
  order:
    pay-timeout-minutes: 30
    platform-fee-rate: 0.02
    auto-receive-days: 7
