spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:campus_trade_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 5
  data:
    redis:
      host: localhost
      port: 6379
      database: 1

jwt:
  secret: test-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-test
  access-token-expiration: 3600000
  refresh-token-expiration: 86400000

alipay:
  app-id: test-app-id
  private-key: test-private-key
  alipay-public-key: test-public-key
  gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: http://localhost:8080/api/payment/callback/alipay
  return-url: http://localhost:8080/api/payment/return/alipay

order:
  payment-timeout-minutes: 1

logging:
  level:
    com.campus.trade: warn
